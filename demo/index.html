<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>CoCreate Editor: Text, Code, Markdown and DOM</title>
        <link rel="stylesheet" href="../dist/CoCreate-editor.css" />
        <style>
            body { max-width: 60rem; margin: 2rem auto; padding: 0 1rem; font: 16px/1.5 system-ui, sans-serif; }
            [editor] { display: block; margin: 0 0 2rem; padding: 0.75rem; border: 1px solid #adb5bd; }
            #document-example { padding: 0; }
        </style>
    </head>
    <body>
        <h1>CoCreate Editor</h1>

        <h2>Plain text</h2>
        <div editor="text" contenteditable="true">Type plain text here.</div>

        <h2>DOM editor</h2>
        <div editor="dom" value="&lt;h3&gt;Edit this heading&lt;/h3&gt;&lt;p&gt;HTML is rendered from its source.&lt;/p&gt;"></div>

        <h2>Markdown</h2>
        <div editor="markdown" value="# Markdown&#10;&#10;Write **Markdown** here."></div>

        <h2>HTML code</h2>
        <div editor="code" editor-language="html" value="&lt;h1 class=&quot;greeting&quot;&gt;hello&lt;/h1&gt;&#10;&lt;h1&gt;hello&lt;/h1&gt;"></div>

        <h2>JavaScript code</h2>
        <div editor="code" editor-language="javascript" value="const greeting = &quot;Hello&quot;;&#10;console.log(greeting);"></div>

        <button id="update-attribute" type="button">Set HTML heading style through the editor</button>

        <h2>HTML document in an iframe</h2>
        <iframe
            id="document-example"
            editor="dom"
            title="HTML document editor"
        ></iframe>

        <script>
            document.addEventListener("editor-error", (event) =>
                console.error("Editor error:", event.detail?.error)
            );
        </script>
        <script src="../dist/CoCreate-editor.js"></script>
        <script>
            document.querySelector("#update-attribute").addEventListener("click", () => {
                const editor = document.querySelector('[editor="dom"]');
                const target = editor.querySelector("h3");
                editor.editor.setAttribute({
                    target,
                    name: "style",
                    value: "color: #7652a3; border-bottom: 2px solid currentColor"
                });
            });
        </script>
    </body>
</html>
